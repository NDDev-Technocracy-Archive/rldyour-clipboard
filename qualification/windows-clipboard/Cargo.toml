[package]
name = "windows-clipboard-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace]

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "=5.4.3", features = ["std", "monitor"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
