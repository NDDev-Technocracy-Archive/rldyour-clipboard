name: Bootstrap source tooling

on:
  push:
    branches: [task/14-standalone-product]
    paths: ['Cargo*', 'crates/**', 'daemon/**', 'tools/**', 'extension/**', 'macos/**', 'rust-toolchain.toml', '.github/workflows/bootstrap-tools.yml']

permissions:
  contents: read

jobs:
  source-tool:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-26-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NDDEV_CLIPBOARD_NATIVE_TESTS: isolated
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: '1.99.1'
          components: rustfmt,clippy
          cache: false
      - name: Check the independent configuration contract
        run: cargo test --locked -p nddev-clipboard-api -p nddev-clipboard-sdk -p nddev-clipboard -p nddev-clipboard-platform -p nddev-clipboard-files -p clipboard-tools
      - name: Compile the source verifier and produce its schema
        shell: bash
        run: |
          cargo clippy --locked -p nddev-clipboard-api -p nddev-clipboard-sdk -p nddev-clipboard -p nddev-clipboard-platform -p nddev-clipboard-files -p clipboard-tools --all-targets -- -D warnings
          cargo build --locked -p clipboard-tools
          target/debug/clipboard-tools generate
          target/debug/clipboard-tools check-version
      - name: Prepare the source verifier artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .build/source-tool
          cp target/debug/clipboard-tools .build/source-tool/
          cp contracts/config.schema.json .build/source-tool/
          cp contracts/local-ipc.openapi.json .build/source-tool/
          git rev-parse HEAD > .build/source-tool/source-commit
          target/debug/clipboard-tools bundle-tool-notices
          target/debug/clipboard-tools release-checksums .build/source-tool
          cd .build/source-tool
          sha256sum --strict --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: clipboard-source-tool-${{ github.sha }}
          path: .build/source-tool/
          if-no-files-found: error
          retention-days: 7
      - name: Qualify the configured daemon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target/debug/clipboard-tools prepare-upgrade-fixture
          cargo clippy --locked -p rldyour-clipboardd --all-targets --all-features -- -D warnings
          cargo test --locked -p rldyour-clipboardd --test profile_lifecycle --all-features
          cargo test --locked -p rldyour-clipboardd --all-features
      - name: Qualify first native copy in a release Windows process
        if: runner.os == 'Windows'
        run: cargo test --locked --release -p rldyour-clipboardd --test profile_lifecycle native_windows_observer_captures_the_first_copy_after_the_protocol_greeting -- --exact
      - name: Qualify the real native CLI and bounded subscription
        run: target/debug/clipboard-tools qualify-native-client
      - name: Qualify the daemon without the optional image decoder
        run: |
          cargo clippy --locked -p rldyour-clipboardd --all-targets --no-default-features -- -D warnings
          cargo test --locked -p rldyour-clipboardd --no-default-features
          cargo build --locked --release -p rldyour-clipboardd --no-default-features
      - name: Prepare the real GJS runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: runner.os == 'Linux'
        with:
          node-version: '26.13.0'
      - name: Check retained extension sources without loading GNOME Shell
        if: runner.os == 'Linux'
        run: target/debug/clipboard-tools check-extension
      - name: Qualify the retained platform client against the configured product
        if: runner.os != 'Windows'
        run: target/debug/clipboard-tools qualify-platform-client
      - name: Measure safe native data reading
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release -p rldyour-clipboardd --example macos-data-read --no-default-features
          /usr/bin/time -l target/release/examples/macos-data-read stream 128
          /usr/bin/time -l target/release/examples/macos-data-read copy 128
