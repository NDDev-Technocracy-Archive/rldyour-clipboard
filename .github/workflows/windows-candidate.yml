name: Evaluate Windows clipboard candidate

on:
  push:
    branches: [task/14-standalone-product]
    paths: ['qualification/windows-clipboard/**', '.github/workflows/windows-candidate.yml']

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: qualification/windows-clipboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: '1.99.1'
          components: rustfmt,clippy
          cache: false
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release --examples
      - name: Native monitor and formats with console subsystem
        run: target/release/examples/console.exe "$RUNNER_TEMP/native-console.txt"
      - name: Native monitor and formats with Windows subsystem
        run: target/release/examples/windowed.exe "$RUNNER_TEMP/native-windowed.txt"
      - name: Read bounded synthetic reports
        if: always()
        run: cat "$RUNNER_TEMP/native-console.txt" "$RUNNER_TEMP/native-windowed.txt"
