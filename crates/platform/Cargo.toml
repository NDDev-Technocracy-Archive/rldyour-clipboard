[package]
name = "nddev-clipboard-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Scoped native operations for NDDev Clipboard"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

[target.'cfg(windows)'.dev-dependencies]
uds_windows = "1.2.1"

# The only native exception is described in docs/decisions/0001-native-boundary.md.
# Ordinary workspace crates inherit unsafe_code = forbid.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
