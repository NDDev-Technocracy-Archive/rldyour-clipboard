[workspace]
members = ["daemon", "crates/api", "crates/sdk", "tools/clipboard-tools"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Danil Silantyev, NDDev"]
repository = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-clipboard"
homepage = "https://nddev.ai"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.2.0"
thiserror = "=2.0.21"
utoipa = "=6.0.0"
sha2 = "0.11"
nddev-clipboard-api = { path = "crates/api" }
nddev-clipboard-sdk = { path = "crates/sdk" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
