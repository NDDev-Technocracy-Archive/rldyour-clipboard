[workspace]
members = ["daemon", "crates/api", "crates/sdk", "crates/platform", "tools/clipboard-tools"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Danil Silantyev, NDDev"]
repository = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-clipboard"
homepage = "https://nddev.ai"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.2.0"
thiserror = "=2.0.21"
socket2 = "=0.6.5"
utoipa = "=6.0.0"
sha2 = "=0.11.1"
image = { version = "=0.25.10", default-features = false }
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false }
objc2-foundation = { version = "=0.3.2", default-features = false }
rusqlite = "=0.41.1"
tempfile = "=3.27.0"
uds_windows = "=1.2.1"
windows-sys = "=0.61.2"
x11rb = "=0.14.0"
clipboard-win = { version = "=5.4.3", features = ["std", "monitor"] }
nddev-clipboard-api = { path = "crates/api", version = "=0.2.2" }
nddev-clipboard-sdk = { path = "crates/sdk", version = "=0.2.2" }
nddev-clipboard-platform = { path = "crates/platform", version = "=0.2.2" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
