[package]
name = "rldyour-clipboardd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Clipboard archive daemon with unbounded entry size for Linux, macOS, and Windows"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-clipboard"

# Every dependency here is one the daemon cannot honestly do without.
# `rusqlite` is bundled so the archive index needs nothing from the host;
# `sha2` gives blobs their content addresses; `image` is the only way to make a
# thumbnail without decoding a picture inside the compositor process, which is
# the one thing the whole architecture exists to avoid. `serde_json` parses the
# control frames: they carry user text, and hand-rolling string unescaping --
# surrogate pairs included -- would be a correctness risk, not a saving.
[dependencies]
nddev-clipboard-api.workspace = true
nddev-clipboard-platform.workspace = true
toml.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
sha2.workspace = true
image = { workspace = true, optional = true, features = [
  "png", "jpeg", "gif", "bmp", "webp",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# X11 is the only Linux display protocol where an unprivileged client may
# read another's selection, which is what makes a daemon-side watcher
# possible there at all. `xfixes` is how the owner change arrives.
x11rb = { workspace = true, features = ["xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSString", "NSArray", "NSEnumerator", "NSData", "NSError", "NSObject", "NSRange"] }
objc2-app-kit = { workspace = true, features = ["std", "NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(target_os = "windows")'.dependencies]
uds_windows.workspace = true
clipboard-win.workspace = true

[features]
default = ["thumbnails"]
# Thumbnailing is the daemon's only image-decoding work. Turning it off drops
# the `image` crate entirely; the UI then falls back to a kind icon.
thumbnails = ["dep:image"]

[dev-dependencies]
nddev-clipboard-sdk.workspace = true
nddev-clipboard-files.workspace = true
private-fs.workspace = true

[lints]
workspace = true

# The daemon sleeps almost all of its life and wakes to copy bytes. Size and
# residency win over throughput. `panic = "abort"` also makes a fault a clean
# restart under the service manager rather than a half-live process holding the
# archive's write lock.
