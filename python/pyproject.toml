[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "rldyour-clipboard"
dynamic = ["version"]
description = "Python client for the rldyour-clipboard archive daemon"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "NDDev OpenNetwork" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-clipboard"
Repository = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-clipboard"
Issues = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-clipboard/issues"

[project.scripts]
rldyour-clipboard = "rldyour_clipboard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rldyour_clipboard"]

[tool.hatch.version]
path = "src/rldyour_clipboard/_contract.py"
